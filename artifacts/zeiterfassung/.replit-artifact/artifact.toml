kind = "web"
previewPath = "/"
title = "Zeiterfassung"
version = "1.0.0"
id = "artifacts/zeiterfassung"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20091

[services.development]
run = "pnpm --filter @workspace/zeiterfassung run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zeiterfassung", "run", "build" ]
serve = "static"
publicDir = "artifacts/zeiterfassung/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20091"
BASE_PATH = "/"
